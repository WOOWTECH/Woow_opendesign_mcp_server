{{- /*
Ingress policy for the two ports.

allowFromAllNamespaces: true is what runs live - `namespaceSelector: {}` plus
`podSelector: {}`, i.e. every namespace and every pod in this one may reach
8080 AND the unauthenticated supergateway on 8000. It is the default here only
so the chart reproduces live; tightening it is a follow-up, not phase 1.
*/ -}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "odmcp.fullname" . }}-policy
  namespace: {{ include "odmcp.ns" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "odmcp.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  ingress:
  {{- if .Values.networkPolicy.allowFromAllNamespaces }}
  - from:
    - namespaceSelector: {}
    ports:
    - port: {{ .Values.ports.admin }}
    - port: {{ .Values.ports.mcp }}
  - from:
    - podSelector: {}
    ports:
    - port: {{ .Values.ports.admin }}
    - port: {{ .Values.ports.mcp }}
  {{- else }}
  - from:
    {{- range $k, $v := .Values.networkPolicy.allowedNamespaceLabels }}
    - namespaceSelector:
        matchLabels:
          {{ $k }}: {{ $v | quote }}
    {{- end }}
    {{- range $k, $v := .Values.networkPolicy.allowedPodLabels }}
    - podSelector:
        matchLabels:
          {{ $k }}: {{ $v | quote }}
    {{- end }}
    ports:
    - port: {{ .Values.ports.admin }}
    - port: {{ .Values.ports.mcp }}
  {{- end }}
  {{- with .Values.networkPolicy.allowFromCidrs }}
  {{- /*
  Pod/namespace selectors are not enough on every cluster: on woow-k3s
  (k3s 1.34) traffic that reaches these ports through the ClusterIP Service is
  NOT matched by `namespaceSelector: {}` or `podSelector: {}` and gets
  rejected, while an ipBlock rule lets it through. Empty by default so the
  rendered policy equals live; set it on clusters where the selectors do not
  match.
  */}}
  - from:
    {{- range . }}
    - ipBlock:
        cidr: {{ . | quote }}
    {{- end }}
    ports:
    - port: {{ $.Values.ports.admin }}
    - port: {{ $.Values.ports.mcp }}
  {{- end }}
{{- end }}
