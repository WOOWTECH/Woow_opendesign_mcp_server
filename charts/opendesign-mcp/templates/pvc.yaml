{{- /*
/data holds config.json: the admin password, the current MCP token and the
rotation history. keepOnUninstall marks it `helm.sh/resource-policy: keep`, so
`helm uninstall` leaves it (and the console's state) behind.
*/ -}}
{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: {{ include "odmcp.fullname" . }}
  name: {{ include "odmcp.fullname" . }}-data
  namespace: {{ include "odmcp.ns" . }}
  {{- include "odmcp.keepAnnotations" . | nindent 2 }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- with .Values.persistence.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
