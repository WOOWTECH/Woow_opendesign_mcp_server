{{- /*
Secret od-mcp-secrets, rendered ONLY with secrets.create=true. By default the
Secret already exists (created out of band from examples/secrets.example.yaml)
and the chart never touches it, so `helm upgrade` cannot overwrite a rotated
JWT_SECRET with an empty value.
*/ -}}
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  labels:
    {{- include "odmcp.labels" . | nindent 4 }}
  name: {{ include "odmcp.secretName" . }}
  namespace: {{ include "odmcp.ns" . }}
  {{- include "odmcp.keepAnnotations" . | nindent 2 }}
type: Opaque
stringData:
  JWT_SECRET: {{ required "secrets.jwtSecret is required when secrets.create=true" .Values.secrets.jwtSecret | quote }}
  # Injected but not read by the application: the login password lives in
  # /data/config.json. Kept because the live Deployment injects it.
  ADMIN_PASSWORD: {{ required "secrets.adminPassword is required when secrets.create=true" .Values.secrets.adminPassword | quote }}
{{- end }}
