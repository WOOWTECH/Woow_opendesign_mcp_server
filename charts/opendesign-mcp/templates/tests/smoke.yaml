{{- /*
`helm test` smoke pod. Read-only: two unauthenticated GETs, no writes, no
token use.
  - admin console  http://<svc>:8080/healthz -> 200 {"status":"ok"}
  - supergateway   http://<svc>:8000/healthz -> 200
Runs the workload image, which already ships python3.
*/ -}}
{{- if .Values.tests.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-smoke
  namespace: {{ include "odmcp.ns" . }}
  labels:
    app.kubernetes.io/part-of: {{ .Values.partOf }}
    app.kubernetes.io/component: smoke-test
  annotations:
    helm.sh/hook: test
    # Kept until the next `helm test` so `helm test --logs` can always read it.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  containers:
    - name: smoke
      image: {{ include "odmcp.testImage" . }}
      imagePullPolicy: {{ include "odmcp.imagePullPolicy" . }}
      command: [python3, -c]
      args:
        - |
          import json, os, sys, urllib.request
          def get(url):
              with urllib.request.urlopen(url, timeout=30) as r:
                  return r.status, r.read().decode()
          admin = os.environ["ADMIN_URL"]
          mcp = os.environ["MCP_URL"]
          s, body = get(admin + "/healthz")
          assert s == 200, (s, body)
          assert json.loads(body).get("status") == "ok", body
          print("admin /healthz:", s, body.strip())
          s, body = get(mcp + "/healthz")
          assert s == 200, (s, body)
          print("supergateway /healthz:", s, body.strip()[:80])
          print("SMOKE OK")
      env:
        - name: ADMIN_URL
          value: http://{{ include "odmcp.fullname" . }}-svc.{{ include "odmcp.ns" . }}.svc.cluster.local:{{ .Values.ports.admin }}
        - name: MCP_URL
          value: http://{{ include "odmcp.fullname" . }}-svc.{{ include "odmcp.ns" . }}.svc.cluster.local:{{ .Values.ports.mcp }}
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 256Mi
{{- end }}
