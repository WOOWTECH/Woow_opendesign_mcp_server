# -----------------------------------------------------------------------------
# Secret for the opendesign-mcp chart - PLACEHOLDERS ONLY. Never commit real
# values, and never point `helm install -f` at this file.
#
# Copy it OUTSIDE the repo, replace every REPLACE_ME value, then apply the copy:
#   kubectl --context default -n open-design apply -f /secure/path/od-mcp-secrets.yaml
#
# With secrets.create=false (the default) the chart only REFERENCES this
# Secret, so rotating a key here and restarting the pod is enough - no
# `helm upgrade` needed and no risk of an upgrade writing an empty value back.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: od-mcp-secrets
  namespace: open-design
  labels:
    app: od-mcp
    app.kubernetes.io/part-of: open-design
type: Opaque
stringData:
  # Signs the admin console's JWTs (HS256). Generate with:
  #   openssl rand -hex 32
  # Anyone holding it can mint an admin token for the console.
  JWT_SECRET: "REPLACE_ME_JWT_SECRET"
  # Injected as the ADMIN_PASSWORD env var. The application does NOT read it:
  # the login password lives in /data/config.json and is seeded as "admin" on
  # the first boot. Change the real password in the console's Settings page.
  ADMIN_PASSWORD: "REPLACE_ME_ADMIN_PASSWORD"
